# Ghostty configuration, mirroring the GNOME Console setup (gtk4.css and the
# org.gnome.Console keys setup.sh writes). Ghostty is the GTK terminal used for
# its OSC 52 support, which VTE-based terminals like Console lack.
#
# Reload a running Ghostty with Ctrl+Shift+, - most settings apply at once,
# window chrome only to new windows.

# Same font as KGX_FONT in setup.sh. `Monospace` is the fontconfig alias, so
# both terminals follow whatever the system maps it to.
font-family = Monospace
font-size = 12

# Console's default colours, light or dark following the GNOME style setting
# like Console's own `theme = auto`. The themes live in ghostty-themes/, which
# setup.sh links into ~/.config/ghostty/themes/.
theme = light:console-day,dark:console-night

# No header bar, like gtk4.css does for Console. GNOME draws no server-side
# title bar on Wayland, so this leaves the window with none at all. The tab bar
# still appears once a second tab is open (window-show-tab-bar = auto).
#
# window-decoration = none would also drop the header, but takes the window's
# shadow and rounded corners with it; gtk-titlebar only removes the bar.
#
# The window is moved, maximised and closed with the same stock GNOME keys as
# Console: Super + drag, Alt+F10, Ctrl+Shift+W.
gtk-titlebar = false

# OSC 52, spelled out because it is why this terminal is here: programs (tmux's
# set-clipboard, Vim over SSH) may write the clipboard freely, but reading it
# back asks first - a silent read would hand the clipboard to anything printing
# to the terminal, including a remote host.
clipboard-write = allow
clipboard-read = ask

# Remote hosts have no xterm-ghostty terminfo entry, so ssh fails with "missing
# or unsuitable terminal". Ghostty's zsh integration wraps ssh to fix that:
# ssh-terminfo copies the entry over (infocmp here, tic there) on the first
# connection to each host and caches the hosts it succeeded on; ssh-env falls
# back to TERM=xterm-256color where that fails, e.g. no tic on the remote.
# Features left out of this list keep their defaults.
#
# Shells inside tmux never hit this: tmux sets TERM to screen-256color.
shell-integration-features = ssh-terminfo,ssh-env
