# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Name windows "<dir>:<command>" instead of just the command, so a screenful of
# panes running claude or zsh stays tellable apart.
#   @win-dir  the basename of the pane's working directory, i.e. the last path
#             component only. The ?/m|r| test renders a home directory
#             (/home/<user>, or /Users/<user> on a Mac) as "~" rather than the
#             login name, which says nothing.
#   @win-cmd  the running command, and the two flags tmux's default name
#             carries: [tmux] in copy mode and [dead] for an exited pane (that
#             second one matters here because remain-on-exit is on).
# These are plain user options rather than literal text so the window name and
# the status line below can share one definition; #{E:...} asks tmux to expand
# the option's value as a format instead of printing it verbatim.
set -g @win-dir '#{?#{m|r|:#{d:pane_current_path},^(/home|/Users)$},~,#{b:pane_current_path}}'
set -g @win-cmd '#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}'
set-window-option -g automatic-rename-format '#{E:@win-dir}:#{E:@win-cmd}'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
set -g mouse on

# Copy mode selections go to the system clipboard.
# The default Enter / mouse-drag bindings run `copy-pipe-and-cancel` with no
# argument, which pipes the selection to whatever `copy-command` is set to.
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y   send-keys -X copy-pipe-no-clear

# clipboard-copy picks the backend (wl-copy / xclip / xsel / pbcopy) at run time
# and drops empty input. That guard matters: tmux pipes an empty selection
# whenever a copy key is pressed without one, and handing zero bytes to wl-copy
# leaves the clipboard owned but unreadable ("No compatible transfer format
# found" on paste).
set -s copy-command "$HOME/.local/bin/clipboard-copy"

# Also emit OSC 52 so copying still reaches the clipboard over SSH or when no
# clipboard binary is installed (needs terminal support).
set -g set-clipboard on

# Paste the system clipboard into the pane.
bind-key C-v run-shell 'tmux set-buffer -- "$(wl-paste --no-newline 2>/dev/null || xclip -selection clipboard -out 2>/dev/null || xsel --clipboard --output 2>/dev/null || pbpaste 2>/dev/null)" && tmux paste-buffer'

setw -g monitor-activity on
set-option -g remain-on-exit on

# split panes using | and -
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

#bind T split-window 'exec ping -c5 google.com'

bind -n M-S-Left  resize-pane -L
bind -n M-S-Right resize-pane -R
bind -n M-S-Up    resize-pane -U
bind -n M-S-Down  resize-pane -D

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift arrow to switch windows
bind -n C-M-Left  previous-window
bind -n C-M-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# window status
# The status line builds the name out of its two halves itself, so the folder
# can be picked out at a glance: black and bold for the directory, blue for the
# command. A window renamed by hand (prefix ,) turns automatic-rename off, and
# then #W - the name as typed - is shown instead.
# Both name backgrounds below are light (GNOME Terminal's Tango cyan #06989a,
# and #34e2e2 for the current window), so the command has to be a DARK colour -
# a light one washes out on #34e2e2. colour18 gives 4.4:1 and 9.8:1; colour17
# (navy) is safer still and colour52 (maroon) is the warm alternative.
# The folder is colour16, i.e. real #000000 at 6.0:1, rather than colour0 -
# Tango paints "black" as #2e3436, which lands at 3.46:1 and leaves the folder
# fainter than the command beside it.
# Both of these come from the 256-colour cube rather than the base 16, so a
# terminal theme that remaps the ANSI colours cannot shift them.
# Styles are written as separate #[...] blocks because a comma inside one would
# be read as an argument separator by the enclosing #{?...}.
set -g @win-name "#{?automatic-rename,#[fg=colour16]#[bold]#{E:@win-dir}#[nobold]#[fg=colour18]:#{E:@win-cmd},#[fg=colour8]#W}"
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #{E:@win-name} "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #{E:@win-name} "
setw -g window-status-current-style bg=colour0,fg=colour11,dim
setw -g window-status-current-style bg=colour238,fg=colour81,bold

#set -g pane-border-style bg=colour235,fg=colour238
#set -g pane-active-border-style bg=colour236,fg=colour251

set -g status-style dim
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left '#[fg=magenta]#[bg=black] « #S » #[bg=cyan]#[fg=colour8]'
set -g status-right '#[fg=colour233,bg=colour241] %a, %b %d, %Y #[fg=colour233,bg=colour245] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 25

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "screen-256color"

#List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

#set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'seebi/tmux-colors-solarized'

#Plugins options
set -g @colors-solarized 'dark'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @resurrect-save-shell-history 'on'

# Restore the programs that were running, not just the window/pane layout.
# Resurrect otherwise revives only a short default whitelist (vi, vim, emacs,
# top, htop, less, ...), so btop and claude come back as bare shells.
#   btop     is saved as exactly "btop", so a plain word match is enough.
#   ~claude  is saved with its full path ("/opt/claude-code/bin/claude
#            --resume"), and the tilde relaxes matching to a substring.
#   ->       gives the command to run instead of replaying the saved one. A
#            restarted claude is a brand new process either way, so ask it to
#            pick the previous conversation for the pane's directory back up
#            (swap for --resume to choose from a list instead).
set -g @resurrect-processes 'btop "~claude->claude --continue"'

# Default is 15 minutes, which is how much layout drift a crash or reboot can
# cost. The save is cheap.
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
